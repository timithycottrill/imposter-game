name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run android:sync
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug lintDebug
        working-directory: android
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Play real Android APK offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 tests/android_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: artifacts/
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk IMPOSTER.apk
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --target "$GITHUB_SHA" --title "IMPOSTER for Android" --notes "Install IMPOSTER.apk on Android 7.0+. Offline game, no accounts. Development-signed APK; verified by automated Android emulator playthrough. Samsung hardware testing remains unverified."
          gh release upload android-latest IMPOSTER.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: imposter-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Test and deploy game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Generate bundled word pictures if needed
        run: bash scripts/prepare-art.sh
      - name: Preserve generated picture atlas in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/art/words.webp
          if ! git diff --cached --quiet; then
            git commit -m "Bundle the generated offline word picture atlas [skip ci]"
            git push
          fi
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Full mobile, offline, and installability tests
        shell: bash
        run: |
          npm run preview > /tmp/imposter-preview.log 2>&1 &
          for i in {1..30}; do curl --fail http://localhost:4173/ >/dev/null 2>&1 && break; sleep 1; done
          CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Verify full game at public HTTPS URL
        env:
          GAME_URL: https://timithycottrill.github.io/imposter-game/
        run: |
          curl --fail --retry 5 --retry-delay 5 "$GAME_URL"
          CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python tests/ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-test-results
          path: artifacts/
